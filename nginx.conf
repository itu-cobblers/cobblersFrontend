server {
    listen 80;
    server_name cobblerscoders.tech www.cobblerscoders.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name cobblerscoders.tech www.cobblerscoders.tech;

    ssl_certificate     /etc/letsencrypt/live/cobblerscoders.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cobblerscoders.tech/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # The stock nginx.conf ships `gzip on` but with gzip_types text/html only, so
    # the app's JS was going out raw. The main bundle is ~4.6MB uncompressed and
    # ~1.2MB gzipped — a 3.4MB saving per student, which matters most at 09:00 when
    # a whole class loads the app at once.
    #
    # Deliberately NOT gzipping application/pdf: the teaching decks are already
    # compressed, so it would burn CPU on a 2-core box for no gain.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml;

    # Vite fingerprints every filename in /assets/ with a content hash, so a given
    # URL can never change meaning. Cache it hard: without this, each student
    # re-validates a 6-23MB teaching PDF on every page load across all three days.
    location /assets/ {
        # One header, not two: `expires 1y` would emit its own Cache-Control and
        # browsers would receive the directive twice.
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        # =404 rather than falling through to /index.html. The SPA fallback used to
        # apply here too, so a missing or misnamed asset returned index.html with a
        # 200 — the PDF viewer would then be handed HTML and fail with no usable
        # error. Fingerprinted assets should 404 loudly instead.
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://backend:5046;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The backend sets no HttpClient.Timeout for Piston, so it will wait out
        # .NET's 100s default. nginx's own default is 60s, which meant a student
        # could be shown a 504 for a job that actually succeeded while the backend
        # kept the Piston slot busy for another 40s. Keeping nginx ABOVE the
        # backend's ceiling makes the backend the thing that decides, so the worst
        # case is an honest 503 rather than a lying 504.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /hub {
        proxy_pass http://backend:5046;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # SignalR's default 15s keepalive currently keeps sockets under nginx's 60s
        # idle default by luck rather than design. Make it explicit so a backend
        # busy enough to miss a couple of pings does not cost the class a
        # reconnect storm.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 80;
    server_name grafana.cobblerscoders.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name grafana.cobblerscoders.tech;

    ssl_certificate     /etc/letsencrypt/live/grafana.cobblerscoders.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafana.cobblerscoders.tech/privkey.pem;

    location / {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/live/ {
        proxy_pass http://grafana:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
